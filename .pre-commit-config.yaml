# Formatters and linters run on every commit. Set up once with: pre-commit install
# Run on the whole repository with: pre-commit run --all-files
repos:
  - repo: local
    hooks:
      - id: prettier-markdown
        name: prettier (Markdown)
        entry: npx --yes prettier@3.9.6 --write
        language: system
        types: [markdown]

      - id: markdownlint
        name: markdownlint-cli2 (Markdown)
        entry: npx --yes markdownlint-cli2@0.22.1
        language: system
        types: [markdown]

      - id: dotnet-format
        name: dotnet format (C#)
        entry: dotnet format src/WinGlance.slnx --include
        language: system
        types: [c#]
